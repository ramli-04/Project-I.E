name: cabinet-sim

# Standalone synthetic stack: no demo overrides, host database, private-file mounts or devices.
x-backend: &backend
  build:
    context: ./cabinet_backend
  environment: &environment
    DJANGO_SETTINGS_MODULE: cabinet_backend.settings
    DJANGO_ALLOWED_HOSTS: .localhost,127.0.0.1,backend,bootstrap,testserver
    DJANGO_DEBUG: "0"
    CABINET_SIMULATION: "1"
    GESTION_LABO_SIMULATION: "1"
    GESTION_LABO_COMPOSE_PROJECT: cabinet-sim
    SIM_RUN: ${SIM_RUN:-normal}
    POSTGRES_HOST: postgres
    POSTGRES_DB: cabinet_sim
    POSTGRES_USER: cabinet_sim
    POSTGRES_PASSWORD: local-synthetic-simulation-only
    POSTGRES_PORT: "5432"
    DJANGO_SECRET_KEY_FILE: /demo/sim-runtime/signing-key
    PRIVATE_MEDIA_ROOT: /demo/sim-media
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    REDIS_CACHE_URL: redis://redis:6379/2
    EXTERNAL_DELIVERY_ENABLED: "0"
    OUTBOX_PUBLISH_ON_COMMIT: "0"
  volumes:
    - sim_runtime:/demo

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cabinet_sim
      POSTGRES_USER: cabinet_sim
      POSTGRES_PASSWORD: local-synthetic-simulation-only
    volumes:
      - sim_postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cabinet_sim -d cabinet_sim"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes:
      - sim_redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  bootstrap:
    <<: *backend
    command: [python, -m, api.simulation.bootstrap]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  backend:
    <<: *backend
    command: [waitress-serve, --listen=0.0.0.0:8000, cabinet_backend.wsgi:application]
    ports:
      - "127.0.0.1:18002:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/platform/environment/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

# Select a NEW SIM_RUN for a new scenario/rerun; keep all earlier volumes.
volumes:
  sim_postgres:
    name: cabinet-sim_${SIM_RUN:-normal}_postgres
  sim_redis:
    name: cabinet-sim_${SIM_RUN:-normal}_redis
  sim_runtime:
    name: cabinet-sim_${SIM_RUN:-normal}_runtime
